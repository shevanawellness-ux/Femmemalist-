<style>

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(to bottom, #fff0f5, #ffe6f0);
  overflow-x:hidden;
}

/* =========================
   FLOATING IMAGE BUTTON
========================= */
#askBtn{
  position:fixed;
  bottom:22px;
  right:22px;
  width:70px;
  height:70px;
  z-index:9999;
  cursor:pointer;
  border-radius:50%;
  overflow:hidden;

  animation:floatSway 4s ease-in-out infinite;
  filter: drop-shadow(0 10px 25px rgba(255,105,180,0.35));
}

/* image inside button */
#askBtn img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  transition:0.3s ease;
}

/* hover effect */
#askBtn:hover img{
  transform:scale(1.08);
  filter:brightness(1.1);
}

/* floating + sway motion */
@keyframes floatSway{
  0%   { transform: translateY(0px) rotate(0deg); }
  25%  { transform: translateY(-6px) rotate(1deg); }
  50%  { transform: translateY(0px) rotate(0deg); }
  75%  { transform: translateY(6px) rotate(-1deg); }
  100% { transform: translateY(0px) rotate(0deg); }
}

/* =========================
   OVERLAY
========================= */
#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.35);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9998;
}

/* =========================
   GLASS MODAL
========================= */
#modal{
  width:92%;
  max-width:420px;
  border-radius:24px;
  padding:18px;

  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.3);
  box-shadow:0 25px 60px rgba(255,105,180,0.25);
}

/* title */
#title{
  font-family:'Playfair Display',serif;
  font-size:20px;
  color:#C71585;
  margin-bottom:12px;
}

/* input row */
.row{
  display:flex;
  gap:10px;
}

#input{
  flex:1;
  padding:12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.4);
  outline:none;
  font-size:14px;
  background:rgba(255,255,255,0.35);
}

#go{
  padding:12px 16px;
  border-radius:14px;
  border:none;
  background:rgba(199,21,133,0.85);
  color:white;
  font-weight:600;
  cursor:pointer;
}

/* suggestion grid */
#suggestions{
  margin-top:15px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.sugg{
  padding:10px;
  border-radius:14px;
  background:rgba(255,105,180,0.22);
  border:1px solid rgba(255,255,255,0.25);
  color:#C71585;
  font-size:13px;
  text-align:center;
  cursor:pointer;
  backdrop-filter:blur(10px);
  transition:0.25s ease;
}

.sugg:hover{
  transform:scale(1.04);
  background:rgba(255,105,180,0.35);
}

/* back */
#back{
  margin-top:12px;
  width:100%;
  padding:10px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.25);
  color:#C71585;
  font-weight:600;
  cursor:pointer;
}

</style>
</head>

  shuffled.forEach(item => {

    const div = document.createElement("div");
    div.className = "sugg";
    div.innerText = item.text;

    div.onclick = () => {
      window.location.href = item.link;
    };

    container.appendChild(div);
  });
}

function createRipple(e){
  const btn = e.currentTarget;

  const circle = document.createElement("span");
  const diameter = Math.max(btn.clientWidth, btn.clientHeight);
  const radius = diameter / 2;

  circle.style.width = circle.style.height = `${diameter}px`;
  circle.style.left = `${e.clientX - btn.offsetLeft - radius}px`;
  circle.style.top = `${e.clientY - btn.offsetTop - radius}px`;
  circle.classList.add("ripple");

  const ripple = btn.getElementsByClassName("ripple")[0];
  if(ripple){
    ripple.remove();
  }

  btn.appendChild(circle);
}

/* attach ripple to buttons */
document.querySelectorAll(".sugg, #go, #back").forEach(el => {
  el.addEventListener("click", createRipple);
});

  </script>
